seed: 42

database:
  latest_metadata_url: https://raw.githubusercontent.com/cbdb-project/cbdb_sqlite/master/latest.json
  official_repo: external/cbdb_sqlite
  raw_db: database/cbdb_latest.sqlite3
  working_db: database/cbdb_working.sqlite3
  working_source_marker: database/cbdb_working.source.sha256
  busy_timeout_ms: 60000

download:
  chunk_size_bytes: 8388608
  timeout_seconds: 60
  retries: 3
  huggingface_mirror_base: https://hf-mirror.com

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  schema_docs: docs/schema
  audit_docs: docs/audit
  figures: outputs/figures
  tables: outputs/tables
  logs: outputs/logs
  models: outputs/models
  splits: data/splits

target:
  definition: entry_data_presence_v1
  people_table: BIOG_MAIN
  entry_table: ENTRY_DATA
  person_id_column: c_personid

analysis:
  exact_distinct_max_rows: 200000
  distinct_sample_target_rows: 200000
  parquet_chunk_rows: 100000
  figure_dpi: 300

modeling:
  random_seed: 42
  full_information_dataset: data/processed/person_base_v0.parquet
  pre_entry_exclude:
    - n_entry_records
    - n_posting_records
    - has_posting_record

