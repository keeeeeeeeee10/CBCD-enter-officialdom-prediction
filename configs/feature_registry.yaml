version: phase2_v1

# Formal Phase 2 model compositions (M0--M6 and PB0/PB1), including
# categorical/numeric roles and fold-derived fields, are executable in:
# configs/phase2_features.yaml

historical_regime:
  status: available
  features:
    - dynasty_name
    - safe_birth_decade
    - has_safe_birth_year

personal:
  status: implemented
  features:
    - gender
    - safe_birth_year
    - safe_birth_decade
    - has_safe_birth_year

geography:
  status: implemented
  features:
    - has_geography
    - addr_id
    - province_id
    - prefecture_id
    - county_id
    - latitude
    - longitude
    - distance_to_dynasty_capital_km
    - local_cbdb_person_count
    - local_address_density
    - local_entry_prior

family_structural:
  status: implemented
  features:
    - father_identified
    - mother_identified
    - paternal_grandfather_identified
    - paternal_grandmother_identified
    - maternal_grandfather_identified
    - maternal_grandmother_identified
    - n_known_parents
    - n_known_grandparents
    - n_known_ancestors
    - n_known_parent_generation
    - n_known_same_generation
    - n_known_descendants
    - n_known_core_kin
    - family_group_size
    - has_core_family

family_cross_sectional:
  status: implemented_temporally_ambiguous
  features:
    - father_ever_entry
    - father_ever_posting
    - mother_ever_entry
    - mother_ever_posting
    - paternal_grandfather_ever_entry
    - paternal_grandfather_ever_posting
    - maternal_grandfather_ever_entry
    - maternal_grandfather_ever_posting
    - n_eligible_older_kin
    - n_older_kin_ever_entry
    - n_older_kin_ever_posting
    - older_kin_entry_ratio
    - older_kin_posting_ratio
    - older_kin_entry_ratio_smoothed
    - older_kin_posting_ratio_smoothed
    - any_older_kin_ever_entry
    - any_older_kin_ever_posting

prebirth_lineage:
  status: implemented_safe_birth_subset_only
  features:
    - father_entry_before_birth
    - father_posting_before_birth
    - paternal_grandfather_entry_before_birth
    - paternal_grandfather_posting_before_birth
    - maternal_grandfather_entry_before_birth
    - maternal_grandfather_posting_before_birth
    - n_older_kin_entry_before_birth
    - n_older_kin_posting_before_birth
    - any_older_kin_entry_before_birth
    - any_older_kin_posting_before_birth

matched_pre_entry_family:
  status: future_sensitivity_not_implemented
  features: []

documentation:
  status: separate
  features:
    - has_address
    - has_kin
    - has_assoc
    - has_status
    - has_text
    - has_institution
    - documentation_intensity

network:
  status: optional_subset
  features: []

forbidden:
  - raw_index_year
  - index_year
  - c_index_year
  - entry_record_count
  - n_entry_records
  - target_entry
  - target_entry_v1
  - target_entry_v2a
  - target_entry_v2b
  - target_posting
  - posting_count
  - n_posting_records
  - has_posting_record
  - family_group_id
